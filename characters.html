<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Герои мира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d1026; --bg2: #161a3a; --ink: #eef0ff; --muted: #9aa0c8; --accent: #ffcf6b; --card: #1c2148; --line: #2d3470; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%); color: var(--ink); font-family: "Rubik", system-ui, sans-serif; min-height: 100vh; }
  header { text-align: center; padding: 36px 16px 8px; }
  h1 { font-family: "Lora", serif; color: var(--accent); font-size: clamp(32px, 6vw, 52px); margin: 0; }
  header p { color: var(--muted); margin: 8px 0 0; }
  header a { color: var(--muted); font-size: 14px; }
  h2 { font-family: "Lora", serif; color: var(--accent); max-width: 1100px; margin: 36px auto 14px; padding: 0 16px; }
  .grid { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .card.wide { grid-column: span 2; }
  @media (max-width: 560px) { .card.wide { grid-column: span 1; } }
  .pic { display: block; width: 100%; height: auto; }
  .info { padding: 14px 18px 18px; }
  .info h3 { font-family: "Lora", serif; color: var(--accent); margin: 0; font-size: 22px; }
  .role { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .info p { margin: 0; line-height: 1.5; font-size: 15px; }
  footer { height: 60px; }
</style>
</head>
<body>
<header>
  <h1>Герои мира</h1>
  <p>Все, кто встретился в книгах про Горилана, Рому и их друзей</p>
  <p><a href="index.html">← к миру рассказов</a> · <a href="game.html">🎮 играть</a></p>
</header>

<h2>Книга 1 · Главные герои</h2>
<div class="grid" id="heroes"></div>
<h2>Книга 1 · Взрослые</h2>
<div class="grid" id="adults"></div>
<h2>Книга 1 · Противники на арене</h2>
<div class="grid" id="foes"></div>
<h2>Книга 2 · Друзья-путешественники</h2>
<div class="grid" id="friends"></div>
<h2>Книга 2 · Дома</h2>
<div class="grid" id="home"></div>
<h2>Книга 2 · Лесные жители</h2>
<div class="grid" id="forest"></div>
<footer></footer>

<script src="art.js"></script>
<script>
// ---------- персонажи ----------
const W = 200, H = 270;
const svg = (w, h, inner) => `<svg class="pic" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const heroes = [
  {
    name: "Горилан", role: "Главный герой · Сиренаголовый · Игориван",
    about: "Темнокожий и накачанный, очень сильный боец. На арене победил льва, пустынного муравья и толстяка. Боится только пустынных муравьёв: из-за них он когда-то убежал из родной деревни. Знает свой родной тарабарский язык.",
    art: svg(W, H, bg("street", W, H) + person({ ...CHAR.gorilan, extra: hammer })),
  },
  {
    name: "Рома", role: "Рассказчик · лучший друг Горилана",
    about: "Обычный мальчик, не накачанный, зато сообразительный. Первым попробовал конфету, первым нашёл щель под железной дверью и вывел друга из арены.",
    art: svg(W, H, bg("street", W, H) + person({ ...CHAR.roma, extra: candy(166, 196) })),
  },
];
const adults = [
  {
    name: "Дядя Толя", role: "Незнакомец с конфетами · похититель",
    about: "Подошёл на улице Алексеевке и угостил ребят конфетой, после которой они потеряли сознание. Потом увёз их на чёрной машине. Всегда в шляпе и сером пальто, хитро щурится.",
    art: svg(W, H, bg("street", W, H) + person({ ...CHAR.tolya, extra: candy(158, 204) })),
  },
  {
    name: "Дяденька из деревни", role: "Житель пустынной деревни · водитель развалюхи",
    about: "Показал друзьям источник с холодной вкусной водой. Получил от Горилана 100 долларов и очень обрадовался. Потом на старой машине отвёз друзей домой и помог уйти от погони.",
    art: svg(W, H, bg("desert", W, H) + person({ ...CHAR.villager, extra: money })),
  },
  {
    name: "Житель деревни", role: "Говорит на тарабарском языке",
    about: "«Эээ… Я русси не пониат. Не поймать». Русского не знает, но Горилан понял его язык: оказалось, это его родной.",
    art: svg(W, H, bg("desert", W, H) + person(CHAR.villager2)),
  },
];
const foes = [
  {
    name: "Лев", role: "Первый противник на арене",
    about: "Большой и грозный, но Горилан победил его голыми руками.",
    art: svg(240, 200, bg("arena", 240, 200) + lion()),
  },
  {
    name: "Пустынный муравей", role: "Самое страшное существо пустыни",
    about: "Кусается так сильно, что жители целых деревень убегают из домов. Если муравьи «влюбляются» в дерево, они собирают с него листья, выращивают на них грибы и кормят ими личинок. К такому дереву боятся даже подойти. Горилан разбил его гигантским молотом.",
    art: svg(240, 200, bg("arena", 240, 200) + ant()),
  },
  {
    name: "Толстяк", role: "Третий противник · до и после удара молотом", wide: true,
    about: "Вышел на сцену весь коричневый. От удара молотом грязь отлетела, и он оказался белым. Такой жирный, что удары ему нипочём. Дрался копьём, но только бил по воздуху. Горилан победил его самурайским мечом, и толстяк пробил в полу гигантскую дыру.",
    art: svg(480, 270, bg("arena", 480, 270) + fatMan(10, false) + `<text x="240" y="150" text-anchor="middle" font-size="40">➜</text>` + fatMan(260, true)),
  },
];

const render = (id, list) => {
  document.getElementById(id).innerHTML = list.map((c) => `<div class="card${c.wide ? " wide" : ""}">${c.art}
    <div class="info"><h3>${c.name}</h3><div class="role">${c.role}</div><p>${c.about}</p></div></div>`).join("");
};
render("heroes", heroes);
render("adults", adults);
render("foes", foes);

const friends = [
  {
    name: "Ромомэо", role: "Главный в походе",
    about: "Взял в поход всё самое нужное: фонарик, ножик, спички, палатку, котелок и карту с компасом. Разводит костёр, ловит раков и варит суп с грибами. Сам смастерил ложки. С Ромой и Гориланом он не знаком: об этом будет в книге «Приключения Омешкина, Пельмешкина и Ромомэо в Москве».",
    art: svg(W, H, bg("forest", W, H) + person({ ...CHAR.romomeo, extra: flashlight })),
  },
  {
    name: "Омешкин", role: "Толстый любитель вкусняшек · придумал операцию «О.М.И.Р.А.»",
    about: "Взял в лес весь свой годовой запас вкусняшек: мороженое, шоколадки, газировку и конфеты. Хотел взять матрас и котю, но они не влезли в рюкзак, поэтому взял одеяло и подушку. На обратном пути оседлал голубого монстра и ехал на нём.",
    art: svg(W, H, bg("forest", W, H) + person({ ...CHAR.omeshkin, extra: iceCream(160, 180) })),
  },
  {
    name: "Пельмешкин (Бока)", role: "Любитель пельмешек · «Эй, вообще-то меня зовут Бока!»",
    about: "Всегда хочет пельмешки. Взял побольше пельменей и соус для чипсов, а одеяло и подушку забыл. Ночью в пещере нашёл белого котёнка, похожего на пельмешек, и накормил его. Отломил кусок кристалла от монстра.",
    art: svg(W, H, bg("forest", W, H) + person({ ...CHAR.pelmeshkin, extra: pelmeniBowl(160, 196) })),
  },
];
const home = [
  {
    name: "Амира", role: "Сестра · ходила с ребятами на речку",
    about: "Мама отпускает ребят на речку только с Амирой. По плану операции «О.М.И.Р.А.» ребята сначала купались с ней, а потом, пока никто не видит, ушли в лес.",
    art: svg(W, H, bg("home", W, H) + person(CHAR.amira)),
  },
  {
    name: "Мама", role: "Готовит на сковородке",
    about: "Разрешила пойти на речку, но только с Амирой. А когда ребята вернулись через окно, зашла в комнату и сказала: «Ах вы ж! Где были? В лесу?!»",
    art: svg(W, H, bg("home", W, H) + person({ ...CHAR.mama, extra: apron + fryingPan })),
  },
  {
    name: "Котя и Ухо", role: "Два белых котёнка · настоящий и «подделка»", wide: true,
    about: "Котя живёт дома: Омешкин хотел взять его в поход, но он не влез в рюкзак. Второго, точно такого же белого котёнка, Пельмешкин нашёл ночью у пещеры. Он был похож на пельмешек! Различить их можно по уху, поэтому второго назвали Ухо.",
    art: svg(480, 200, bg("home", 480, 200) + `<g transform="translate(10 30)">${kitten(0, false)}</g><g transform="translate(250 30)">${kitten(0, true)}</g>`
      + `<text x="120" y="24" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="600" font-size="18" fill="#6b4a2b">Котя</text>`
      + `<text x="360" y="24" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="600" font-size="18" fill="#6b4a2b">Ухо</text>`),
  },
];
const forest = [
  {
    name: "Голубой монстр", role: "Пещера, которая оказалась великаном",
    about: "Ребята спрятались от дождя в «пещере» с синими кристаллами, а утром оказалось, что всю ночь они сидели на руках у гигантского голубого монстра. На голове у него сироп, а глаз один и полностью чёрный. Говорит «Гог! Гок!». Омешкин доехал на нём до самого холма у дома.",
    art: svg(240, 260, bg("cave", 240, 260) + blueMonster()),
  },
  {
    name: "Раки", role: "Речные жители · и рачок-рассказчик", wide: true,
    about: "Ромомэо поймал в прозрачной речке целую кучу раков и сварил из них суп с грибами. Раки стали красные, «как рак», и Омешкин понял, где раки зимуют. А маленький рачок жил в рюкзаке у Ромомэо: похоже, это он и рассказывает всю историю!",
    art: svg(480, 220, bg("forest", 480, 220) + `<rect y="150" width="480" height="70" fill="#7fc8e8" opacity=".55"/>` + crayfish(170, 130, 1.5, false) + crayfish(380, 150, 0.8, true)),
  },
];
render("friends", friends);
render("home", home);
render("forest", forest);
</script>
</body>
</html>
